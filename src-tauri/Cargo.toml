[package]
name = "signage-desktop"
version = "0.1.3"
description = "Windows digital-signage player for the Katuxa store fleet"
edition = "2021"
rust-version = "1.82"

[lib]
name = "signage_desktop"
path = "src/lib.rs"

[[bin]]
name = "signage-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs4 = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

# The control channel and downloads. rustls throughout rather than the platform TLS stack,
# so a `wss://` tunnel behaves the same on the Windows screens as it does here.
tokio = { version = "1", features = ["macros", "sync", "time", "io-util", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = [
    "stream",
    "rustls",
    # System trust store, so a store behind a corporate proxy CA still downloads.
    "rustls-native-certs",
] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Power"] }

[profile.release]
# A signage box should not be shipping a 40 MB binary over a store link.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
