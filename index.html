<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>K-player</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The canvas sits under the video and holds the last frame across a rebuild, so a
         glitch does not flash black. It is the equivalent of ExoPlayer's
         keep_content_on_player_reset. -->
    <canvas id="freeze"></canvas>
    <video id="video" playsinline></video>

    <div id="notice" hidden>
      <div class="card glass"></div>
    </div>

    <!-- "Which screen is number 11?" — ten seconds of the device name, over the video. -->
    <div id="identify" hidden><div class="name glass"></div></div>

    <div id="setup" hidden>
      <form id="setup-form" class="glass" novalidate>
        <p class="wordmark">K-player</p>
        <h1>Configurar tela</h1>
        <p class="hint" id="setup-hint"></p>

        <label for="setup-server">Endereço do servidor</label>
        <input
          id="setup-server"
          type="text"
          placeholder="192.168.1.10:8080"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />

        <label for="setup-store">Loja</label>
        <input
          id="setup-store"
          type="text"
          placeholder="710"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />

        <label for="setup-name">Nome da tela <span class="optional">(opcional)</span></label>
        <input
          id="setup-name"
          type="text"
          placeholder="pc-entrada-01"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />

        <label class="checkbox" for="setup-kiosk">
          <input id="setup-kiosk" type="checkbox" />
          <span>
            Modo quiosque
            <small>Impede que a tela seja fechada. Ctrl+Shift+Q ainda encerra.</small>
          </span>
        </label>

        <p class="error" id="setup-error" hidden></p>

        <div class="actions">
          <button type="submit" id="setup-save">Salvar e continuar</button>
          <button type="button" id="setup-cancel" hidden>Continuar</button>
          <!-- The window is borderless, so there is no close button anywhere else. -->
          <button type="button" id="setup-quit" class="quiet">Sair</button>
        </div>

        <p class="device-id">ID do dispositivo: <span id="setup-device-id"></span></p>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
